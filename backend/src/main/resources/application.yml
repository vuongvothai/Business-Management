spring:
  datasource:
    url: jdbc:mysql://localhost:3307/business_management
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-please-32chars}
    jwt-expiration: ${JWT_EXPIRATION:PT8H}
